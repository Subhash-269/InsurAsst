# Docker Desktop Kubernetes:  kubectl apply -k k8s/overlays/local   ->  http://localhost:8080
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# Secret built from a git-ignored file (copy secrets.env.example -> secrets.env and fill it in)
secretGenerator:
  - name: insurance-assistant-secrets
    namespace: insurance-assistant
    envs:
      - secrets.env

patches:
  # the image comes straight from the local Docker engine; there is no registry to pull from
  - target:
      kind: Deployment
      name: insurance-assistant
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Docker Desktop exposes LoadBalancer services on localhost
  - target:
      kind: Service
      name: insurance-assistant
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 8080
