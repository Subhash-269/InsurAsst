# Non-secret settings, injected as environment variables (secrets come from the overlay's Secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: insurance-assistant-config
data:
  DJANGO_DEBUG: "0"
  # localhost is what the probes send (see deployment.yaml); overlays add the public hostname
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
  DEMO_READONLY: "1"
  MLFLOW_TRACING: "0"
  LLM_BACKEND: "openai"
  LLM_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
  LLM_MODEL: "gemini-3.5-flash-lite"
  GUNICORN_THREADS: "8"
